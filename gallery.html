<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Gallery - SOLMÅNE</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Lato', Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    
    .gallery-header {
      padding: 3rem 2rem;
      text-align: center;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
    }
    
    .gallery-header h1 {
      font-size: 3rem;
      letter-spacing: 0.2em;
      margin: 0 0 1rem 0;
      font-weight: 900;
      text-transform: uppercase;
    }
    
    .back-button {
      display: inline-block;
      padding: 1rem 2rem;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      letter-spacing: 0.08em;
      margin-top: 2rem;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(255,255,255,0.3);
    }
    
    .full-gallery {
      padding: clamp(1.25rem, 3vw, 4rem) clamp(0.9rem, 2.5vw, 2rem);
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .album-section {
      margin-bottom: 1rem;
    }

    .album-title {
      margin: 0;
    }

    .album-toggle {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      column-gap: 1rem;
      row-gap: 0.4rem;
      background: #0f0f0f;
      border: 1px solid #2d2d2d;
      border-left: 4px solid #fff;
      border-radius: 8px;
      color: #f5f5f5;
      cursor: pointer;
      padding: 0.9rem 1rem;
      text-align: left;
      transition: background 0.25s, border-color 0.25s;
    }

    .album-toggle:hover {
      background: #191919;
      border-color: #4a4a4a;
    }

    .album-name {
      font-size: clamp(1rem, 2.1vw, 1.6rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
      word-break: break-word;
    }

    .album-meta {
      font-size: clamp(0.72rem, 1.4vw, 0.95rem);
      color: #b5b5b5;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .album-caret {
      font-size: 1.1rem;
      transform: rotate(0deg);
      transition: transform 0.25s;
      color: #fff;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 0.9rem;
    }

    .album-section.is-collapsed .album-caret {
      transform: rotate(-90deg);
    }

    .album-section.is-collapsed .album-grid {
      display: none;
    }

    @media (max-width: 760px) {
      .album-toggle {
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 0.8rem;
      }

      .album-meta {
        grid-column: 1 / 2;
        white-space: normal;
      }

      .album-caret {
        grid-column: 2 / 3;
        grid-row: 1 / 3;
        justify-self: end;
      }

      .album-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }
    
    .gallery-item {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 32px rgba(255,255,255,0.2);
    }
    
    .gallery-item img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

    const albumsContainer = document.getElementById('albums-container');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('close-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    
    let currentImageIndex = 0;
    let currentAlbumImages = [];

    function previewPathFor(imagePath) {
      return encodeURI(
        imagePath
          .replace('assets/gallery/', 'assets/gallery-previews/')
          .replace(/\.(jpg|jpeg|png)$/i, '.jpg')
      );
    }
    
    // Load albums and their images
    Object.entries(albums).forEach(([albumName, images]) => {
      const section = document.createElement('section');
      section.className = 'album-section is-collapsed';

      const title = document.createElement('h2');
      title.className = 'album-title';

      const toggle = document.createElement('button');
      toggle.className = 'album-toggle';
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', 'false');

      const name = document.createElement('span');
      name.className = 'album-name';
      name.textContent = albumName;

      const right = document.createElement('span');
      right.className = 'album-meta';
      right.textContent = `${images.length} photos`;

      const caret = document.createElement('span');
      caret.className = 'album-caret';
      caret.setAttribute('aria-hidden', 'true');
      caret.textContent = '▾';

      toggle.appendChild(name);
      toggle.appendChild(right);
      toggle.appendChild(caret);
      title.appendChild(toggle);

      const grid = document.createElement('div');
      grid.className = 'album-grid';

      const gridId = `album-grid-${albumName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
      grid.id = gridId;
      toggle.setAttribute('aria-controls', gridId);

      toggle.addEventListener('click', () => {
        const isCurrentlyCollapsed = section.classList.contains('is-collapsed');

        document.querySelectorAll('.album-section').forEach(albumSection => {
          albumSection.classList.add('is-collapsed');
          const albumToggle = albumSection.querySelector('.album-toggle');
          if (albumToggle) albumToggle.setAttribute('aria-expanded', 'false');
        });

        if (isCurrentlyCollapsed) {
          section.classList.remove('is-collapsed');
        }

        const isExpanded = !section.classList.contains('is-collapsed');
        toggle.setAttribute('aria-expanded', String(isExpanded));
      });

      images.forEach((imagePath, index) => {
        const imageContainer = document.createElement('div');
        imageContainer.className = 'gallery-item';

        const img = document.createElement('img');
        img.src = previewPathFor(imagePath);
        img.alt = albumName;
        img.loading = 'lazy';
        img.decoding = 'async';

        imageContainer.appendChild(img);
        imageContainer.addEventListener('click', () => openLightbox(images, index));
        grid.appendChild(imageContainer);
      });

      section.appendChild(title);
      section.appendChild(grid);
      albumsContainer.appendChild(section);
    });
    
    function openLightbox(albumImages, index) {
      currentAlbumImages = albumImages;
      currentImageIndex = index;
      lightboxImg.src = encodeURI(currentAlbumImages[index]);
      lightbox.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    
    function closeLightbox() {
      lightbox.style.display = 'none';
      document.body.style.overflow = 'auto';
    }
    
    function showNextImage() {
      if (!currentAlbumImages.length) return;
      currentImageIndex = (currentImageIndex + 1) % currentAlbumImages.length;
      lightboxImg.src = encodeURI(currentAlbumImages[currentImageIndex]);
    }
    
    function showPrevImage() {
      if (!currentAlbumImages.length) return;
      currentImageIndex = (currentImageIndex - 1 + currentAlbumImages.length) % currentAlbumImages.length;
      lightboxImg.src = encodeURI(currentAlbumImages[currentImageIndex]);
    }
    
    closeBtn.addEventListener('click', closeLightbox);
    nextBtn.addEventListener('click', showNextImage);
    prevBtn.addEventListener('click', showPrevImage);
    
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') showNextImage();
        if (e.key === 'ArrowLeft') showPrevImage();
      }
    });
    
    // Hover effects for buttons
    [prevBtn, nextBtn, closeBtn].forEach(btn => {
      btn.addEventListener('mouseenter', () => btn.style.background = 'rgba(255,255,255,0.3)');
      btn.addEventListener('mouseleave', () => btn.style.background = 'rgba(255,255,255,0.1)');
    });
  </script>
</body>
</html>
